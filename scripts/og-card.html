<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #000000;
    background-image:
      radial-gradient(circle at 15% 15%, rgba(0, 209, 255, 0.16), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(124, 58, 237, 0.20), transparent 50%);
    font-family: -apple-system, "Inter", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 90px;
    position: relative;
    overflow: hidden;
  }
  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 44px;
    position: relative;
    z-index: 1;
  }
  .logo-mark {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: linear-gradient(135deg, #00D1FF, #7C3AED);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 26px;
    color: #000;
  }
  .brand-name {
    font-size: 26px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.01em;
  }
  h1 {
    font-size: 60px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.12;
    letter-spacing: -0.02em;
    max-width: 920px;
    position: relative;
    z-index: 1;
  }
  h1 .accent {
    background: linear-gradient(90deg, #00D1FF, #7C3AED);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.tagline {
    margin-top: 26px;
    font-size: 26px;
    color: #A7B0BD;
    max-width: 820px;
    font-weight: 400;
    position: relative;
    z-index: 1;
  }
  .footer-row {
    position: absolute;
    bottom: 56px;
    left: 90px;
    right: 90px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 20px;
    color: #6B7280;
    font-family: "JetBrains Mono", monospace;
    z-index: 1;
  }
  .footer-row .domain { color: #00D1FF; }
</style>
</head>
<body>
  <div class="grid-overlay"></div>
  <div class="brand">
    <div class="logo-mark">1</div>
    <div class="brand-name">101 Tech Labs</div>
  </div>
  <h1>AI Automation &amp; <span class="accent">Custom Software</span> Development</h1>
  <p class="tagline">RAG pipelines, AI agents, and enterprise platforms — built for businesses in Noida, Delhi NCR, and remote clients worldwide.</p>
  <div class="footer-row">
    <span class="domain">101techlabs.com</span>
    <span>Noida, India</span>
  </div>
</body>
</html>
