<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="lineGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9D4EDD" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="boxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141b26"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1016"/>
      <stop offset="100%" stop-color="#05070A"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowPurple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full-bleed card background so the diagram fills its container edge to
       edge, with no transparent gaps on the right where the database sits. -->
  <rect x="0" y="0" width="800" height="500" fill="url(#canvasBg)" />

  <!-- Subtle background grid -->
  <g stroke="#ffffff" stroke-width="1" stroke-opacity="0.02">
    <path d="M0,100 L800,100 M0,250 L800,250 M0,400 L800,400 M200,0 L200,500 M400,0 L400,500 M600,0 L600,500" />
  </g>

  <!-- Connections / Data Pipes -->
  <g fill="none" stroke="url(#lineGrad)" stroke-width="3" opacity="0.7">
    <!-- CI/CD to Servers -->
    <path d="M 170 250 C 250 250, 300 150, 380 150" />
    <path d="M 170 250 C 250 250, 300 350, 380 350" />
    <!-- Servers to Database -->
    <path d="M 480 150 C 530 150, 550 250, 610 250" />
    <path d="M 480 350 C 530 350, 550 250, 610 250" />
  </g>

  <!-- Animated Data Particles (Pure CSS/SVG Animation) -->
  <circle cx="0" cy="0" r="5" fill="#00E5FF" filter="url(#glowCyan)">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M 170 250 C 250 250, 300 150, 380 150"/>
  </circle>
  <circle cx="0" cy="0" r="5" fill="#00E5FF" filter="url(#glowCyan)">
    <animateMotion dur="2.5s" begin="1.25s" repeatCount="indefinite" path="M 170 250 C 250 250, 300 350, 380 350"/>
  </circle>
  <circle cx="0" cy="0" r="5" fill="#9D4EDD" filter="url(#glowPurple)">
    <animateMotion dur="2.5s" begin="0.5s" repeatCount="indefinite" path="M 480 150 C 530 150, 550 250, 610 250"/>
  </circle>
  <circle cx="0" cy="0" r="5" fill="#9D4EDD" filter="url(#glowPurple)">
    <animateMotion dur="2.5s" begin="1.75s" repeatCount="indefinite" path="M 480 350 C 530 350, 550 250, 610 250"/>
  </circle>

  <!-- Component 1: CI/CD Pipeline Hub (Left) -->
  <g transform="translate(50, 170)">
    <circle cx="60" cy="80" r="70" fill="#00E5FF" opacity="0.05" filter="url(#glowCyan)"/>
    <rect x="0" y="20" width="120" height="120" rx="24" fill="url(#boxBg)" stroke="#00E5FF" stroke-width="2" stroke-opacity="0.6"/>
    <!-- CI/CD Code Icon -->
    <g transform="translate(35, 45)" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="0,15 15,0 0,-15" transform="translate(10, 35)"/>
      <polyline points="0,-15 -15,0 0,15" transform="translate(40, 35)"/>
      <line x1="20" y1="50" x2="30" y2="20" />
    </g>
    <text x="60" y="170" fill="#8b949e" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="2">CI/CD</text>
  </g>

  <!-- Component 2: App Server 1 (Top Middle) -->
  <g transform="translate(350, 80)">
    <rect x="0" y="0" width="140" height="140" rx="20" fill="url(#boxBg)" stroke="#4facfe" stroke-width="2" stroke-opacity="0.4"/>
    <!-- Docker Container Blocks -->
    <rect x="30" y="30" width="35" height="35" rx="8" fill="#00E5FF" fill-opacity="0.1" stroke="#00E5FF" stroke-width="2"/>
    <rect x="75" y="30" width="35" height="35" rx="8" fill="#00E5FF" fill-opacity="0.1" stroke="#00E5FF" stroke-width="2"/>
    <rect x="30" y="75" width="35" height="35" rx="8" fill="#00E5FF" fill-opacity="0.1" stroke="#00E5FF" stroke-width="2"/>
    <rect x="75" y="75" width="35" height="35" rx="8" fill="#00E5FF" fill-opacity="0.1" stroke="#00E5FF" stroke-width="2"/>
    <text x="70" y="165" fill="#8b949e" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">APP SERVER</text>
  </g>

  <!-- Component 3: App Server 2 (Bottom Middle) -->
  <g transform="translate(350, 280)">
    <rect x="0" y="0" width="140" height="140" rx="20" fill="url(#boxBg)" stroke="#4facfe" stroke-width="2" stroke-opacity="0.4"/>
    <!-- Docker Container Blocks -->
    <rect x="30" y="30" width="35" height="35" rx="8" fill="#00E5FF" fill-opacity="0.1" stroke="#00E5FF" stroke-width="2"/>
    <rect x="75" y="30" width="35" height="35" rx="8" fill="#00E5FF" fill-opacity="0.1" stroke="#00E5FF" stroke-width="2"/>
    <rect x="30" y="75" width="35" height="35" rx="8" fill="#00E5FF" fill-opacity="0.1" stroke="#00E5FF" stroke-width="2"/>
    <rect x="75" y="75" width="35" height="35" rx="8" fill="#00E5FF" fill-opacity="0.1" stroke="#00E5FF" stroke-width="2"/>
    <text x="70" y="165" fill="#8b949e" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">APP SERVER</text>
  </g>

  <!-- Component 4: Shared Database (Right) -->
  <g transform="translate(600, 160)">
    <circle cx="70" cy="90" r="80" fill="#9D4EDD" opacity="0.05" filter="url(#glowPurple)"/>
    <rect x="0" y="10" width="140" height="160" rx="24" fill="url(#boxBg)" stroke="#9D4EDD" stroke-width="2" stroke-opacity="0.6"/>
    <!-- Database Disks -->
    <g stroke="#9D4EDD" stroke-width="2" fill="#9D4EDD" fill-opacity="0.15" transform="translate(35, 45)">
      <path d="M 0 20 L 0 40 A 35 12 0 0 0 70 40 L 70 20" />
      <ellipse cx="35" cy="20" rx="35" ry="12" />
      <path d="M 0 45 L 0 65 A 35 12 0 0 0 70 65 L 70 45" />
      <ellipse cx="35" cy="45" rx="35" ry="12" />
      <path d="M 0 70 L 0 90 A 35 12 0 0 0 70 90 L 70 70" />
      <ellipse cx="35" cy="70" rx="35" ry="12" />
    </g>
    <text x="70" y="200" fill="#8b949e" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="2">DATABASE</text>
  </g>
</svg>
