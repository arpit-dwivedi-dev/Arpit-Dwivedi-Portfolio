<svg class="pi" viewBox="0 0 900 620" preserveAspectRatio="xMidYMid meet" width="100%" height="auto" fill="none" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Layered architecture illustration</title>
<defs>
<style>.pi{--stroke:#191F28;--muted:#8495A5;--cyan:#02D1FE;--violet:#A78BF9;--violet-deep:#3F2578}
@keyframes pi-flow{to{stroke-dashoffset:0}}
@keyframes pi-blink{0%,100%{opacity:.28}50%{opacity:1}}
.pi-pulse{stroke-dasharray:120 880;stroke-dashoffset:1000;animation:pi-flow 7s linear infinite}
.pi-b{animation:pi-blink 4.4s ease-in-out infinite}
.pi-b2{animation-delay:1.1s}
.pi-b3{animation-delay:2.2s}
@media(prefers-reduced-motion:reduce){.pi-pulse,.pi-b{animation:none}.pi-pulse{stroke-dasharray:none;stroke-dashoffset:0}}</style>
<radialGradient id="pi-glow"><stop offset="0" stop-color="var(--violet-deep,#3F2578)" stop-opacity=".5"/><stop offset="1" stop-color="var(--violet-deep,#3F2578)" stop-opacity="0"/></radialGradient>
<path id="pi-trace" d="M 215.7 176.5 L 379 140.6 L 379 300.6 L 499.7 327.2 L 499.7 487.2 L 655.9 452.8 L 762.4 476.2" pathLength="1000"/>
</defs>

<!-- Glow sits under everything. Radial gradient, not a blur filter — same look, no filter cost on mobile. -->
<ellipse cx="450" cy="478" rx="300" ry="108" fill="url(#pi-glow)" opacity=".55"/>

<!-- BOTTOM PLANE — the engineering. Densest mesh, dimmest layer. -->
<g opacity=".5" stroke="var(--stroke,#191F28)" stroke-width="1">
<polygon points="95,470 450,392 805,470 450,548" stroke-width="1.5"/>
<path d="M 124.6 463.5 L 479.6 541.5 M 124.6 476.5 L 479.6 398.5 M 154.2 457 L 509.2 535 M 154.2 483 L 509.2 405 M 183.8 450.5 L 538.8 528.5 M 183.8 489.5 L 538.8 411.5 M 213.3 444 L 568.3 522 M 213.3 496 L 568.3 418 M 242.9 437.5 L 597.9 515.5 M 242.9 502.5 L 597.9 424.5 M 272.5 431 L 627.5 509 M 272.5 509 L 627.5 431 M 302.1 424.5 L 657.1 502.5 M 302.1 515.5 L 657.1 437.5 M 331.7 418 L 686.7 496 M 331.7 522 L 686.7 444 M 361.2 411.5 L 716.2 489.5 M 361.2 528.5 L 716.2 450.5 M 390.8 405 L 745.8 483 M 390.8 535 L 745.8 457 M 420.4 398.5 L 775.4 476.5 M 420.4 541.5 L 775.4 463.5"/>
<path d="M 173.1 487.2 L 528.1 409.2 M 286.7 427.9 L 641.7 505.9 M 382.6 533.2 L 737.5 455.2" stroke="var(--muted,#8495A5)" stroke-width="1.4" opacity=".6"/>
<g fill="var(--muted,#8495A5)" stroke="none" opacity=".55"><circle cx="242.9" cy="476.5" r="2"/><circle cx="302.1" cy="450.5" r="2"/><circle cx="450" cy="444" r="2"/><circle cx="390.8" cy="496" r="2"/><circle cx="450" cy="470" r="2"/><circle cx="597.9" cy="463.5" r="2"/><circle cx="509.2" cy="509" r="2"/><circle cx="568.3" cy="483" r="2"/><circle cx="538.8" cy="437.5" r="2"/><circle cx="302.1" cy="502.5" r="2"/><circle cx="627.5" cy="444" r="2"/><circle cx="597.9" cy="502.5" r="2"/></g>
</g>
<!-- Violet nodes sit outside the .5 dim on purpose — inside it they vanish at 380px wide. -->
<g fill="var(--violet,#A78BF9)" opacity=".85"><circle cx="300.9" cy="480.9" r="3.6" class="pi-b"/><circle cx="386.1" cy="437.2" r="3.6" class="pi-b pi-b2"/><circle cx="499.7" cy="496.5" r="3.6" class="pi-b pi-b3"/><circle cx="592" cy="451.3" r="3.6"/></g>

<!-- CYAN TRACE — drawn here, before the middle plane, so the modules occlude it on the way down. -->
<g stroke="var(--cyan,#02D1FE)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
<use href="#pi-trace" stroke-opacity=".4"/>
<use href="#pi-trace" class="pi-pulse"/>
</g>

<!-- MIDDLE PLANE — the system. Modules and routing. -->
<g opacity=".75" stroke="var(--stroke,#191F28)">
<polygon points="95,310 450,232 805,310 450,388" stroke-width="1.3"/>
<g fill="var(--muted,#8495A5)" fill-opacity=".08" stroke-width="1.3">
<polygon points="158.9,311.6 237,294.4 300.9,308.4 222.8,325.6"/>
<polygon points="251.2,285 315.1,271 371.9,283.5 308,297.5"/>
<polygon points="364.8,269.4 450,250.7 513.9,264.8 428.7,283.5"/>
<polygon points="279.6,335 343.5,320.9 400.3,333.4 336.4,347.4"/>
<polygon points="371.9,308.4 450,291.3 513.9,305.3 435.8,322.5"/>
<polygon points="506.8,291.3 577.8,275.7 634.6,288.2 563.6,303.8"/>
<polygon points="457.1,342.8 535.2,325.6 599.1,339.6 521,356.8"/>
<polygon points="577.8,319.4 655.9,302.2 719.8,316.2 641.7,333.4"/>
</g>
<path d="M 261.9 317 L 283.1 321.7 L 396.8 296.7 L 410.9 299.9 M 339.9 290.5 L 396.8 303 M 471.3 274.1 L 528.1 286.6 M 371.9 327.2 L 393.2 322.5 L 382.6 320.1 L 403.9 315.5 M 481.9 298.3 L 510.3 292.1 M 368.4 340.4 L 400.3 347.4 L 478.4 330.3 L 496.1 334.2 M 474.9 313.9 L 531.6 326.4 M 567.1 332.6 L 602.7 324.8 M 599.1 296 L 641.7 305.3" stroke="var(--muted,#8495A5)" stroke-width="1" opacity=".7"/>
<g fill="var(--muted,#8495A5)" stroke="none" opacity=".8"><circle cx="283.1" cy="321.7" r="2.2"/><circle cx="396.8" cy="296.7" r="2.2"/><circle cx="393.2" cy="322.5" r="2.2"/><circle cx="382.6" cy="320.1" r="2.2"/><circle cx="400.3" cy="347.4" r="2.2"/><circle cx="478.4" cy="330.3" r="2.2"/><circle cx="339.9" cy="290.5" r="2.2"/><circle cx="471.3" cy="274.1" r="2.2"/><circle cx="481.9" cy="298.3" r="2.2"/><circle cx="474.9" cy="313.9" r="2.2"/><circle cx="567.1" cy="332.6" r="2.2"/><circle cx="599.1" cy="296" r="2.2"/></g>
</g>

<!-- TOP PLANE — the surface. Full opacity, least going on. This is the layer that should read first. -->
<g stroke="var(--stroke,#191F28)">
<polygon points="95,150 450,72 805,150 450,228" stroke-width="1.4"/>
<path d="M 199 152.6 Q 187.3 150 199 147.4 L 438.3 94.9 Q 450 92.3 461.7 94.9 L 701 147.4 Q 712.7 150 701 152.6 L 461.7 205.1 Q 450 207.7 438.3 205.1 Z" fill="var(--muted,#8495A5)" fill-opacity=".05" stroke-width="1.5"/>
<g fill="var(--muted,#8495A5)" stroke="none">
<polygon points="244.1,150 382.5,119.6 403.9,124.3 265.4,154.7" fill-opacity=".24"/>
<polygon points="318.6,166.4 492.6,128.2 510.3,132.1 336.4,170.3" fill-opacity=".14"/>
<polygon points="371.9,178.1 481.9,153.9 499.7,157.8 389.6,182" fill-opacity=".14"/>
<!-- The accent pill is muted, not cyan — cyan is reserved for the leading edge and the trace. -->
<path d="M 427.8 114 Q 418 111.8 427.8 109.7 L 450.9 104.5 Q 460.7 102.4 470.5 104.6 L 472.1 104.9 Q 481.9 107.1 472.1 109.3 L 449.1 114.3 Q 439.3 116.5 429.5 114.3 Z" fill-opacity=".5"/>
</g>
<polyline points="95,150 450,228 805,150" stroke="var(--cyan,#02D1FE)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- Droppers — the surface is held up by what's under it. Kept clear of the card so they don't clutter it. -->
<g opacity=".5">
<path d="M 212.1 171.1 L 212.1 491.1 M 687.8 128.9 L 687.8 448.9 M 545.9 202.3 L 545.9 522.3 M 340 100.9 L 340 420.9" stroke="var(--stroke,#191F28)" stroke-width="1"/>
<g fill="var(--muted,#8495A5)" opacity=".7"><circle cx="212.1" cy="171.1" r="2.4"/><circle cx="212.1" cy="331.1" r="2.4"/><circle cx="212.1" cy="491.1" r="2.4"/><circle cx="687.8" cy="128.9" r="2.4"/><circle cx="687.8" cy="288.9" r="2.4"/><circle cx="687.8" cy="448.9" r="2.4"/><circle cx="545.9" cy="202.3" r="2.4"/><circle cx="545.9" cy="362.3" r="2.4"/><circle cx="545.9" cy="522.3" r="2.4"/><circle cx="340" cy="100.9" r="2.4"/><circle cx="340" cy="260.9" r="2.4"/><circle cx="340" cy="420.9" r="2.4"/></g>
</g>
</svg>
